name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Debug APK derle
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CodePad-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: APK'yı Release olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CodePad.apk
          gh release create "build-${{ github.run_number }}" CodePad.apk \
            --title "Code Pad build ${{ github.run_number }}" \
            --notes "CodePad.apk dosyasını indirip kur. Aynı imzayla derlendiği için eski sürümün üzerine silmeden güncellenir."
